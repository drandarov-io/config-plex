# Plex mpv.conf overrides
# 

# https://mpv.io/manual/master/
# https://github.com/mpv-player/mpv/blob/master/DOCS/man/vf.rst


#############
# Languages #
#############

alang=jpn,jp,eng,en,enUS,en-US,de,ger		# Audio language priority
slang=eng,en,und,de,ger,jp,jap 			# Subtitle language priority


###########
# GPU API # 
###########


# gpu-api=vulkan    # Vulkan Linux, Windows (preferred)
# gpu-api=opengl    # OpenGL on Linux or macOS or Windows
# gpu-api=d3d11     # DirectX on Windows (required for d3d11vpp nvidia-true-hdr)


##################
# Video Profiles #
##################

# profile=gpu-hq	# mpv --show-profile=gpu-hq
# vo=gpu-next		# Already default; GPU-Next: https://github.com/mpv-player/mpv/wiki/GPU-Next-vs-GPU
# hwdec=d3d11va		# Already default; required for d3d11vpp nvidia-true-hdr
hr-seek-framedrop=no


##########
# Colors #
##########

###### Tone mapping
tone-mapping=auto			# spline on gpu-next (libplacebo default)
# tone-mapping=bt.2446a			# ITU-R BT.2446 Method A: the reference HDR->SDR curve (best for SDR output)
# tone-mapping=bt.2390			# HDR-display EETF - darkens midtones when mapping to SDR, avoid for SDR output

###### HDR (always-on, safe for SDR too)
target-colorspace-hint=yes		# OFF: when ON the display/OS does final mapping, making mpv's tone curve & target-contrast inert. OFF = mpv does the full HDR->SDR tone-map (curve/contrast take effect)
# target-peak=204			# DO NOT set above 203 for SDR output: mpv then treats the SDR display as a fake HDR display ("unexpected results" per manual) - this is the mode that ignored target-contrast and crushed blacks
gamma-factor=1.1			# Clean midtone-gamma lift for too-dark HDR->SDR (>1 brightens, <1 darkens). Doesn't change tone-map mode, so target-contrast/curve stay active. Try 1.05-1.25
target-contrast=inf			# OLED perfect black. Now active again since we're in normal SDR tone-map mode
hdr-compute-peak=yes			# dynamic per-frame peak detection instead of static metadata
hdr-peak-percentile=99.995		# ignore top 0.005% specular highlights when measuring peak


###########
# Shaders #
###########

# scale=ewa_lanczos4sharpest

###### Luma up (uncomment one shader line only)	See: https://artoriuz.github.io/blog/mpv_upscaling.html
# glsl-shader="X:\.rs\ArtCNN_C4F32_DS.glsl"
# glsl-shader="~~/shaders/ravu-zoom-ar-r3-rgb.hook"		# good balance between performance and quality
# glsl-shader="~~/shaders/FSRCNNX_x2_8-0-4-1.glsl"
#scale=ewa_lanczos
#scale-blur=0.981251

###### Chroma up + down (optional, uncomment one shader line only if your hardware can support it)
# glsl-shader="~~/shaders/JointBilateral.glsl"
# glsl-shader="~~/shaders/FastBilateral.glsl"
# glsl-shader="~~/shaders/CfL_Prediction.glsl"
#cscale=lanczos
#sigmoid-upscaling=yes

###### Interpolation
# video-sync=display-resample
# interpolation=yes
# tscale=sphinx
# tscale-blur=0.6991556596428412
# tscale-radius=1.05
# tscale-clamp=0.0


#############
# Subtitles #
#############

# Alpha is the first hex pair in #AARRGGBB: FF = opaque, 80 = 50% transparent, 00 = invisible.
sub-color="#80FFFFFF"			# text fill, 50% transparent white
sub-outline-color="#BF000000"		# outline, 25% transparent black
sub-back-color="#80000000"		# shadow/background box, 50% transparent black

# Plain-text subs (SRT etc.) honor the above automatically.
# Uncomment to also force these onto styled ASS/SSA subtitles (may alter their look):
# sub-ass-override=force

# Note: image-based subtitles (PGS/Blu-ray, DVD/VobSub) cannot be made transparent.


############
# Playback #
############

[default]